- name: 1.1.1 Ensure a separate partition for containers has been created (Manual)
  ansible.builtin.shell:
    cmd: |
      mountpoint -- "$(docker info -f '{{"{{"}} .DockerRootDir {{"}}"}}')"
  tags:
   - not_scored
   - section1.2
  failed_when: false

- name: 1.1.2 Ensure only trusted users are allowed to control Docker daemon (Automated)
  user:
    name: "{{ item }}"
    group: docker
  with_items: "{{ tursted_users }}"
  tags:
   - scored
   - section1.1.2

- name: 1.1.3 Ensure auditing is configured for the Docker daemon (Automated)
  lineinfile:
    dest: /etc/audit/rules.d/audit.rules
    line: "-w /usr/bin/docker -k docker"
    state: present
  notify: Reload auditd Rules
  tags:
  - scored
  - section1.1.3

- name: 1.1.4 Ensure auditing is configured for Docker files and directories /run/containerd (Automated)
  lineinfile:
    dest: /etc/audit/rules.d/audit.rules
    line: "-a exit,always -F path=/run/containerd -F perm=war -k docker"
    state: present
  notify: Reload auditd Rules
  tags:
   - scored
   - section1.1.4

- block:
  - name: 1.1.5 Ensure auditing is configured for Docker files and directories /var/lib/docker (Automated)
    lineinfile:
      dest: /etc/audit/rules.d/audit.rules
      line: "-a exit,always -F path=/var/lib/docker -F perm=war -k docker"
      state: present
  - name: 1.1.5 Ensure auditing is configured for Docker files and directories /var/lib/docker (Automated)
    lineinfile:
      dest: /etc/audit/rules.d/audit.rules
      line: "-a exit,never -F dir=/var/lib/docker/volumes"
      state: present
  - name: 1.1.5 Ensure auditing is configured for Docker files and directories /var/lib/docker (Automated)
    lineinfile:
      dest: /etc/audit/rules.d/audit.rules
      line: "-a exit,never -F dir=/var/lib/docker/overlay2"
      state: present
  notify: Reload auditd Rules
  tags:
  - scored
  - section1.1.5

